<svg xmlns="http://www.w3.org/2000/svg" width="490" height="343" viewBox="0 0 490 343" role="img" aria-label="gig 10: claude-e2e. open source. claude code plugin. /e2e drives a real browser over ur app: breakpoints, a11y, visual checks, screenshots and video as receipts."><title>gig 10: claude-e2e. open source. claude code plugin. /e2e drives a real browser over ur app: breakpoints, a11y, visual checks, screenshots and video as receipts.</title><style>@font-face{font-family:"Oxanium";font-weight:200 800;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Chakra Petch";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Share Tech Mono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@keyframes blink{50%{opacity:0}}
@keyframes fade{from{opacity:0}}
