.blink{animation:blink 2.4s steps(1) infinite}
.gla{animation:gla 6s steps(1) infinite}.glb{animation:glb 6s steps(1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.wipe{display:none}}
