<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="139" viewBox="0 0 1000 139" role="img" aria-label="gigs: the fixer board"><title>gigs: the fixer board</title><style>@font-face{font-family:"Oxanium";font-weight:200 800;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Share Tech Mono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
