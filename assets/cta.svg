<svg xmlns="http://www.w3.org/2000/svg" width="181" height="50" viewBox="0 0 181 50" role="img" aria-label="breach it: take the ride on luizgodoy.dev"><title>breach it: take the ride on luizgodoy.dev</title><style>@font-face{font-family:"Oxanium";font-weight:200 800;src:url(data:font/woff2;base64,) format("woff2")}
@keyframes blink{50%{opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dashoffset:400}}
@keyframes pulse{50%{opacity:.45}}
@keyframes cursor{0%,99%{opacity:.8}100%{opacity:0}}
@keyframes acquire{from{transform:scale(1.18);opacity:0}}
@keyframes sheen{0%{transform:translateX(-130%)}35%,100%{transform:translateX(130%)}}
@keyframes gla{0%,88%,100%{opacity:0;transform:none}89%{opacity:.9;transform:translate(-5px,0)}91%{opacity:.9;transform:translate(4px,-2px)}93%{opacity:.9;transform:translate(-2px,1px)}94%{opacity:0}}
@keyframes glb{0%,89%,100%{opacity:0;transform:none}90%{opacity:.9;transform:translate(5px,0)}92%{opacity:.9;transform:translate(-3px,2px)}94%{opacity:.9;transform:translate(2px,0)}95%{opacity:0}}
.blink{animation:blink 2.4s steps(1) infinite}
.gla{animation:gla 6s steps(1) infinite}.glb{animation:glb 6s steps(1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.wipe{display:none}}
.sheen{animation:sheen 4s cubic-bezier(.2,.8,.2,1) 1s infinite;transform:translateX(-130%)}</style><defs><linearGradient id="grad" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f6b6be"/><stop offset=".5" stop-color="#29ab87"/><stop offset="1" stop-color="#b9a2e8"/></linearGradient><linearGradient id="panel" x1=".3" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#2c181e"/><stop offset="1" stop-color="#140c0f"/></linearGradient><clipPath id="c1"><path d="M10 0H181V40L171 50H0V10Z"/></clipPath><linearGradient id="sheen" x1="0" x2="1"><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset=".65" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><g clip-path="url(#c1)"><rect width="181" height="50" fill="#f6b6be"/><text x="26" y="31" font-family="Oxanium, sans-serif" font-size="16" font-weight="600" fill="#130c0d" letter-spacing="2.56" >BREACH IT</text><path d="M141.152 31.0l11 -11M144.152 20.0h8v8" fill="none" stroke="#130c0d" stroke-width="2.2"/><rect class="sheen" x="-2" y="-2" width="185" height="54" fill="url(#sheen)"/></g></svg>